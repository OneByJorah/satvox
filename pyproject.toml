[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "satvox"
version = "1.0.0"
description = "A Jarvis-style wake-word voice pipeline — a hub and Raspberry Pi satellites that hear, think, and speak entirely on your own hardware."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "OneByJorah"}]
keywords = ["voice", "wake-word", "openwakeword", "raspberry-pi", "home-automation", "voice-assistant", "offline-ai", "stt", "tts", "honcho", "self-hosted", "privacy", "iot", "satellite", "jorahone"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Home Automation",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Multimedia :: Sound/Audio",
]
requires-python = ">=3.11"
dependencies = [
    "pyaudio>=0.2",
    "numpy>=1.24",
    "sounddevice>=0.4",
    "openwakeword>=0.1",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "websockets>=12.0",
    "torch>=2.0",
]

[project.optional-dependencies]
hub = ["faster-whisper>=0.9", "coqui-tts>=0.1", "torchaudio>=2.0"]
dev = ["pytest", "black", "flake8"]

[project.urls]
Homepage = "https://github.com/OneByJorah/satvox"
Repository = "https://github.com/OneByJorah/satvox"
Issues = "https://github.com/OneByJorah/satvox/issues"

[tool.setuptools.packages.find]
include = ["satvox*"]
