name: Publish to PyPI

# PyPI Trusted Publishing (OIDC) — no tokens or secrets required.
# One-time manual setup (repo owner, on pypi.org):
#   "Add a new pending publisher" on https://pypi.org/manage/account/publishing/
#   with: PyPI project name = satvox, owner = OneByJorah, repository = satvox,
#         workflow filename = publish-pypi.yml, environment = (blank).
# Publishing runs ONLY on a published GitHub release or manual dispatch.
# NOTE: the wheel currently ships metadata only (satvox is an installable app,
# not a library) — do not expect `pip install satvox` to provide modules yet.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install build tools
        run: python -m pip install --upgrade pip build
      - name: Build sdist and wheel
        run: python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
